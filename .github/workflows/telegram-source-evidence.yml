name: Extract Telegram Source Evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-source-evidence.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only UI reference ZIP
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            /*
            !/Telegram-master-rest-*.zip
          sparse-checkout-cone-mode: false
      - name: Verify only UI ZIP fetched
        run: bash .github/scripts/check_telegram_checkout_blobs.sh ui
      - name: Extract exact selected source to runner temp
        env:
          OUT: \${{ runner.temp }}/eve-source-evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          archive=pathlib.Path("Telegram-master.zip")
          dest=pathlib.Path(os.environ["OUT"])
          dest.mkdir(parents=True,exist_ok=True)
          base="TMessagesProj/src/main/java/org/telegram/"
          source_names=[
              "ui/LoginActivity.java","ui/Components/RadialProgressView.java",
              "ui/MainTabsLayout.java","ui/MainTabsActivity.java",
              "ui/Components/glass/GlassTabView.java","ui/Components/glass/GlassTabsView.java",
              "utils/glass/GlassEngine.java","ui/Components/blur3/LiquidGlassEffect.java"
          ]
          selected=[]
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              provenance=[n for n in names if n.endswith("EVE_PROVENANCE.md")]
              if len(provenance)!=1:
                  raise RuntimeError("EVE_PROVENANCE.md NOT FOUND or ambiguous in repo ZIP")
              prefix=provenance[0][:-len("EVE_PROVENANCE.md")]
              needed={prefix+"EVE_PROVENANCE.md",prefix+"LICENSE"}
              needed.update(prefix+base+p for p in source_names)
              missing=needed-set(names)
              if missing: raise RuntimeError("Required source NOT FOUND: "+repr(sorted(missing)))
              for name in names:
                  if name in needed or (
                      name.startswith(prefix+"TMessagesProj/src/main/res/drawable")
                      and name.lower().endswith((".webp",".png",".xml",".jpg",".jpeg"))
                  ):
                      if name.endswith("/"): continue
                      relative=name[len(prefix):]
                      parts=pathlib.PurePosixPath(relative).parts
                      if relative.startswith("/") or ".." in parts: raise RuntimeError("Unsafe path")
                      target=dest.joinpath(*parts)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      data=z.read(name)
                      target.write_bytes(data)
                      selected.append((relative,hashlib.sha256(data).hexdigest()))
          archive_hash=hashlib.sha256(archive.read_bytes()).hexdigest()
          (dest/"source-hashes.json").write_text(json.dumps({
              "archive_sha256":archive_hash,"file_hashes":dict(selected)},indent=2))
          print("EVE_PROVENANCE=FOUND")
          print("SOURCE_SELECTED="+str(len(selected)))
          print("ARCHIVE_SHA256="+archive_hash)
          PY
      - name: Upload exact selected evidence
        uses: actions/upload-artifact@v4
        with:
          name: eve-telegram-source-evidence
          path: \${{ runner.temp }}/eve-source-evidence
          if-no-files-found: error
          retention-days: 3
