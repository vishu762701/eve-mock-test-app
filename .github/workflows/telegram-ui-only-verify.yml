name: Verify Telegram UI Core Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-ui-only-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-core:
    name: Verify one Telegram ZIP and prove other five absent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout UI core only
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            /*
            !/Telegram-master-rest-*.zip
          sparse-checkout-cone-mode: false

      - name: Prove ZIP blob objects present only for UI core
        run: bash .github/scripts/check_telegram_checkout_blobs.sh ui

      - name: Verify Telegram UI core manifest and imported app icons
        run: python3 -B .github/scripts/verify_telegram_archives.py --ui-only

      - name: Upload UI-only verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-ui-core-verification
          path: telegram-verification-result.json
          if-no-files-found: warn
