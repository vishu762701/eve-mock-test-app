name: Build EVE Universal Development APK

# One-shot build on initial workflow addition and optional explicit rerun.
# Ordinary app pushes do not trigger this expensive four-ABI build.
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-universal-dev-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eve-universal-development-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  universal-dev-apk:
    name: Assemble universal development APK (4 ABIs)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android 36 platform
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare pinned native build toolchain and all ABI targets
        env:
          EVE_ALL_ABIS: 'true'
        run: bash .github/scripts/prepare-qr-native.sh

      - name: Build full four-ABI debug APK without FULL test suite
        run: |
          set -euo pipefail
          gradle :app:assembleDebug -Peve.nativeAbis=arm64-v8a,armeabi-v7a,x86_64,x86 --stacktrace --console=plain

      - name: Verify debug signing and four native ABIs
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          unzip -Z1 "$APK" > /tmp/eve-apk-entries.txt
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            if ! grep -q "^lib/$abi/" /tmp/eve-apk-entries.txt; then
              echo "::error::Missing native ABI $abi in universal development APK"
              exit 1
            fi
          done
          sha256sum "$APK" > eve-universal-apk.sha256
          cat eve-universal-apk.sha256
          echo "Universal development APK built from commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private-run universal debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eve-universal-dev-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            eve-universal-apk.sha256
          if-no-files-found: error
          retention-days: 14
