name: Build Eve APK

on:
  push:
    branches: [ main, master, fix/ci-build ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '*.txt'
      - '.github/workflows/docs.yml'
      - '.github/scripts/verify-docs.mjs'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '*.txt'
      - '.github/workflows/docs.yml'
      - '.github/scripts/verify-docs.mjs'
  workflow_dispatch:

env:
  APP_VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify retired feature has no active references
        run: |
          if git grep -Ein 'UiStudio|uistudio|ui-studio|studio_' -- app/src/main backend/src; then
            echo "Retired UI Studio references remain in active source."
            exit 1
          fi

      - name: Check google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json missing. Firebase console se download karke app/ folder me daalo."
            exit 1
          fi

      - name: Accept Android SDK licenses and install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Verify native UI runner and visual evidence contracts
        run: python3 -B -m unittest discover -s .github/scripts/tests -v

      - name: Preflight Android resources and Kotlin unit-test compilation
        run: gradle :app:processDebugResources :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --stacktrace

      - name: Build debug APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          echo "## Gradle Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully." >> $GITHUB_STEP_SUMMARY

      - name: Android lint and unit tests
        run: gradle lintDebug testDebugUnitTest assembleDebugAndroidTest --stacktrace

  native-ui:
    name: Native UI (${{ matrix.navigation }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        navigation: [gesture, three-button]
    # Both navigation modes must pass before the verified APK can be published.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android compile platform
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Enable KVM for native UI verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify approved native UI behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          script: bash .github/scripts/verify-native-ui.sh ${{ matrix.navigation }}
      - name: Generate visual gallery and XML review inventory
        if: always()
        run: |
          python3 .github/scripts/eve_visual_review.py --captures ui-renderings --source app/src/main/res --output ui-renderings
          echo "### Eve Visual Evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "The runner generates visual-review.html and visual-review.json; selected fixture PNGs are emitted in job logs. Only the verified APK is uploaded." >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce complete theme evidence when native tests pass
        if: success()
        run: python3 .github/scripts/eve_visual_review.py --captures ui-renderings --source app/src/main/res --output ui-renderings --enforce

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-package-lock
      - name: Check backend types and tests
        working-directory: backend
        run: |
          npm run build
          npm test

  firebase-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate optional Firebase Functions and question parser
        run: |
          npm run build --prefix functions
          npm test --prefix functions

  publish-apk:
    name: Publish verified debug APK
    needs: [build, native-ui, backend, firebase-functions]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json missing."
            exit 1
          fi

      - name: Install Android compile platform
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK from verified commit
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --stacktrace

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Eve-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
