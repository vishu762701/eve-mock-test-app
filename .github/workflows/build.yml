name: Build Eve APK

on:
  push:
    branches: [ main, master, fix/ci-build ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '*.txt'
      - '.github/workflows/docs.yml'
      - '.github/scripts/verify-docs.mjs'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '*.txt'
      - '.github/workflows/docs.yml'
      - '.github/scripts/verify-docs.mjs'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify retired feature has no active references
        run: |
          if git grep -Ein 'UiStudio|uistudio|ui-studio|studio_' -- app/src/main backend/src; then
            echo "Retired UI Studio references remain in active source."
            exit 1
          fi

      - name: Check google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json missing. Firebase console se download karke app/ folder me daalo."
            exit 1
          fi

      - name: Accept Android SDK licenses and install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Verify native UI runner failure propagation
        run: python3 -B -m unittest discover -s .github/scripts/tests -v

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          echo "## Gradle Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully." >> $GITHUB_STEP_SUMMARY

      # Upload immediately after compilation, independently of UI verification.
      - uses: actions/upload-artifact@v4
        with:
          name: Eve-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Android lint and unit tests
        run: gradle lintDebug testDebugUnitTest assembleDebugAndroidTest --stacktrace

  native-ui:
    name: Native UI (${{ matrix.navigation }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        navigation: [gesture, three-button]
    # Independent jobs: an emulator failure cannot cancel or block the APK job.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android compile platform
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Enable KVM for native UI verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify approved native UI behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          script: bash .github/scripts/verify-native-ui.sh ${{ matrix.navigation }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-ui-verification-${{ matrix.navigation }}
          path: |
            ui-renderings/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-package-lock
      - name: Check backend types and tests
        working-directory: backend
        run: |
          npm run build
          npm test

  firebase-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate optional Firebase Functions and question parser
        run: |
          npm run build --prefix functions
          npm test --prefix functions
