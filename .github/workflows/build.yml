name: Build Eve APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json missing. Firebase console se download karke app/ folder me daalo."
            exit 1
          fi

      - name: Accept Android SDK licenses and install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log || {
            echo "## Gradle Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Record failure log if build failed
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-error-log
          tail -n 250 build.log > build-error.txt
          git add build-error.txt
          git commit -m "chore: record CI build failure log" || true
          git push -f origin ci-error-log || true

      - uses: actions/upload-artifact@v4
        with:
          name: Eve-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
