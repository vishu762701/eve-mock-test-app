name: Verify Official Telegram Verbatim Imports

# Explicit manual verification only. No automatic push/PR checks during development.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-verbatim-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
      - name: Verify immutable source bytes from official DrKLO/Telegram
        run: bash .github/scripts/verify-official-telegram-imports.sh
