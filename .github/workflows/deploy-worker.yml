name: Deploy Eve Worker & Apply D1 Migrations

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Typecheck TypeScript Code
        working-directory: backend
        run: npm run build

      - name: Run Backend Unit Tests
        working-directory: backend
        run: npm test

      - name: Apply D1 Migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a50b9cf54c5e84de0183a5d3a4b38844
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty or missing in GitHub repository secrets!"
            exit 1
          fi
          OUTPUT=$(echo "y" | npx wrangler d1 migrations apply eve-database --remote 2>&1) || {
            STATUS=$?
            ESCAPED="${OUTPUT//$'\n'/'%0A'}"
            echo "::error title=D1 Migration Failed::$ESCAPED"
            echo "$OUTPUT"
            exit $STATUS
          }
          ESCAPED="${OUTPUT//$'\n'/'%0A'}"
          echo "::notice title=D1 Migration Succeeded::$ESCAPED"
          echo "$OUTPUT"

      - name: Configure Worker Secrets (if present)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a50b9cf54c5e84de0183a5d3a4b38844
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          fi

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 'a50b9cf54c5e84de0183a5d3a4b38844'
          workingDirectory: 'backend'
