name: Deploy Eve Worker & Apply D1 Migrations

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Typecheck TypeScript Code
        working-directory: backend
        run: npm run build

      - name: Run Backend Unit Tests
        working-directory: backend
        run: npm test

      - name: Apply D1 Migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty or missing in GitHub repository secrets!"
            exit 1
          fi
          OUTPUT=$(npx wrangler d1 migrations apply eve-database --remote --yes 2>&1) || {
            STATUS=$?
            echo "::error title=D1 Migration Failed::Exit $STATUS: $OUTPUT"
            echo "$OUTPUT"
            exit $STATUS
          }
          echo "::notice title=D1 Migration Succeeded::$OUTPUT"
          echo "$OUTPUT"

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'backend'
