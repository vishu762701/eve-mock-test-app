name: Verify Documentation

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/scripts/verify-docs.mjs'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/scripts/verify-docs.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  verify-docs:
    name: Documentation Quality & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/Telegram-master*.zip
          sparse-checkout-cone-mode: false
      - name: Prove unused Telegram ZIP blobs were not downloaded
        run: bash .github/scripts/check_telegram_checkout_blobs.sh none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Documentation & Policy Integrity
        run: node .github/scripts/verify-docs.mjs
