name: Verify Documentation

# Explicit manual verification only. No automatic push/PR checks during development.
on:
  workflow_dispatch:

jobs:
  verify-docs:
    name: Documentation Quality & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Documentation & Policy Integrity
        run: node .github/scripts/verify-docs.mjs
