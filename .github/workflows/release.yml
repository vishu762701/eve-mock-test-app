name: Release Eve App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.1.0)'
        required: false
        default: '1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/Telegram-master*.zip
          sparse-checkout-cone-mode: false
      - name: Prove unused Telegram ZIP blobs were not downloaded
        run: bash .github/scripts/check_telegram_checkout_blobs.sh none

      # GPL-covered Telegram art is present in the APK. Production distribution
      # needs a separate, affirmative human compliance review before any signing.
      - name: Require reviewed GPL distribution clearance
        env:
          EVE_GPL_RELEASE_APPROVED: ${{ vars.EVE_GPL_RELEASE_APPROVED }}
        run: |
          set -euo pipefail
          if [ "$EVE_GPL_RELEASE_APPROVED" != "true" ]; then
            echo "::error::Production release blocked: GPL source/dependency/distribution review is not approved. See docs/telegram-release-compliance-gate.md."
            exit 1
          fi
          echo "Manual distribution-review attestation is present; this check does not certify legal compliance."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi
          if [ ! -s app/google-services.json ]; then
            echo "::error::app/google-services.json is missing or empty."
            exit 1
          fi

      - name: Validate release signing secrets and decode keystore
        id: decode_keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Required release signing credentials are missing. Refusing to produce a release."
            exit 1
          fi
          umask 077
          mkdir -p /tmp/keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/release.keystore
          if [ ! -s /tmp/keystore/release.keystore ]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi
          echo "keystore_path=/tmp/keystore/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses and install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Validate Android source before releasing
        run: |
          set -euo pipefail
          gradle lintDebug testDebugUnitTest --stacktrace --console=plain 2>&1 | tee ci-release-preflight.log

      - name: Build Release APK and AAB
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ github.ref_name || inputs.version_name || '1.0.0' }}
          RELEASE_STORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          CI: "true"
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace --console=plain 2>&1 | tee ci-release-gradle.log

      - name: Explain release failure without suppressing it
        if: ${{ failure() }}
        run: python3 .github/scripts/ci_failure_report.py ci-release-preflight.log ci-release-gradle.log

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Eve-Release-Binaries
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
